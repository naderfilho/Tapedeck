name: Report

# Publishes the example's report to GitHub Pages so it can be read without cloning anything.
#
# The page is *regenerated from the committed fixture on every push*, never uploaded by hand. A
# published artefact that was produced once, locally, months ago is a screenshot pretending to be
# a result; this one cannot drift from the code that made it, because the code makes it again each
# time. If the engine breaks, this job fails rather than serving a stale page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a half-deployed page is a broken link.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish the report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # See ci.yml: v5 caches for the package manager by default, and pnpm arrives in the
          # step after this one.
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the site
        # One command, the same one Vercel runs, so the two deployments cannot drift: it compiles
        # the packages, replays the committed year of BTCUSDT to regenerate the report, runs the
        # benchmark, and assembles `site/`.
        #
        # The demo bundles the kernel for the browser. That it can be bundled at all is the point:
        # core, indicators and report import nothing from `node:`, so they were already portable.
        # `out/report.html` stays the self-contained file ADR-0013 describes; the copy under
        # `/report/` gets a header, because a page on a site needs a way back and a file does not.
        run: pnpm site:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
